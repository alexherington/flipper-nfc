[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flipper-nfc"
version = "0.1.0"
description = "Read and write NFC tags from your computer using a Flipper Zero over USB"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Alex Herington" }]
keywords = ["flipper-zero", "nfc", "usb", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = [
    "platformdirs>=4.0",
    "pyserial>=3.5",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/alexherington/flipper-nfc"
Repository = "https://github.com/alexherington/flipper-nfc"
Issues = "https://github.com/alexherington/flipper-nfc/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
flipper-nfc = "flipper_nfc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flipper_nfc*"]

[tool.ruff]
line-length = 100
target-version = "py311"
